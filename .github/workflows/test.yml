name: DNA biological rules
on:
  push:
    branches: [main, feature/dna-builder-lab]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run scientific validation tests
        run: npm test
      - name: Check module syntax
        run: |
          node --check app.mjs
          node --check dna-core.mjs
          node --check server.mjs
